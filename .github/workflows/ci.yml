# Comprobaciones que no necesitan base de datos ni secretos. La compilación completa la hace Vercel en cada push.
name: CI

on:
  push:
    branches: [main, feature/dev, feature/QA]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm lint
      - run: pnpm check:logic
