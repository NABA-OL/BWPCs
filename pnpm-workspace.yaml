allowBuilds:
  sharp: true
  unrs-resolver: true
# Avisos de seguridad en dependencias transitivas con versión fijada por sus padres (mismo major).
overrides:
  undici: ">=7.29.1 <8"
  browserslist: ">=4.28.7 <5"
  source-map-js: ">=1.2.2 <2"
  baseline-browser-mapping: ">=2.11.0 <3"
# Avisos de herramientas de build (eslint, tailwind/postcss) sin parche directo en su padre (2026-10-22). Versiones con más de 2 semanas publicadas.
  "brace-expansion@<2": ">=1.1.21 <2"
  "brace-expansion@>=5 <5.0.12": ">=5.0.12 <6"
  "nanoid@<3.3.18": ">=3.3.18 <3.3.21"
  "postcss@<8.5.23": ">=8.5.23 <8.5.30"
